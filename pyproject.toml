[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling",
]

[project]
name = "aa-markettracker-plugin"
description = "Market tracking module for allianceauth"
readme = "README.md"
keywords = [
    "allianceauth",
    "markettracker",
]
license = { file = "LICENSE" }
authors = [
    { name = "Peter Pfeufer", email = "develop@ppfeufer.de" },
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "allianceauth>=5.0,<6",
    "celery>=5.5,<6",
    "django>=5.2,<6",
    "django-celery-beat>=2.8",
    "django-esi>=9.4,<10",
    "django-eveonline-sde>=0.1,<1",
    "django-eveuniverse>=2,<3",
    "fittings>=2.3.2,<3",
    "requests>=2.9.1",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = [
    "version",
]

[project.optional-dependencies]
tests = [
    "fakeredis>=2.37",
    "pytest>=8",
    "pytest-django>=4.10",
    "ruff>=0.11",
]

[tool.hatch.version]
path = "markettracker/__init__.py"

[tool.hatch.build]
include = [
    "/markettracker",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"markettracker/migrations/*.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "markettracker.tests.settings"
pythonpath = ["."]
testpaths = ["markettracker/tests", "audit_tests"]
