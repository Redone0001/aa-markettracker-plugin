{% load i18n %}

<div class="dropdown">
  <button
    class="btn btn-outline-secondary btn-sm dropdown-toggle"
    type="button"
    data-bs-toggle="dropdown"
    data-bs-auto-close="outside"
    aria-expanded="false"
  >
    {% trans "Module types" %}
    {% if selected_module_filter_count %}
      <span class="badge text-bg-primary ms-1">{{ selected_module_filter_count }}</span>
    {% endif %}
  </button>
  <div class="dropdown-menu p-3" style="min-width: 250px;">
    <div class="small text-muted mb-2">{% trans "Matches any selected type" %}</div>
    {% for module_filter in module_filters %}
      <div class="form-check">
        <input
          class="form-check-input"
          type="checkbox"
          name="module"
          value="{{ module_filter.key }}"
          id="{{ module_filter_id_prefix|default:'module-filter' }}-{{ module_filter.key }}"
          {% if module_filter.selected %}checked{% endif %}
        >
        <label
          class="form-check-label"
          for="{{ module_filter_id_prefix|default:'module-filter' }}-{{ module_filter.key }}"
        >
          {{ module_filter.label }}
        </label>
      </div>
    {% endfor %}
  </div>
</div>
