{% load i18n %}

<fieldset class="d-flex flex-wrap gap-1 align-items-center m-0 p-0 border-0">
  <legend class="visually-hidden">{% trans "Item types" %}</legend>
  <span class="item-filter-label small fw-semibold me-1">{% trans "Item types:" %}</span>
  {% for item_filter in item_filters %}
    <input
      class="btn-check"
      type="checkbox"
      name="item_type"
      value="{{ item_filter.key }}"
      id="{{ item_filter_id_prefix|default:'item-filter' }}-{{ item_filter.key }}"
      autocomplete="off"
      {% if item_filter.selected %}checked{% endif %}
    >
    <label
      class="btn item-filter-btn btn-sm"
      for="{{ item_filter_id_prefix|default:'item-filter' }}-{{ item_filter.key }}"
    >
      {{ item_filter.label }}
    </label>
  {% endfor %}

  <div class="form-check form-switch ms-2">
    <input
      class="form-check-input"
      type="checkbox"
      role="switch"
      name="exclude_item_types"
      value="1"
      id="{{ item_filter_id_prefix|default:'item-filter' }}-exclude"
      {% if exclude_item_types %}checked{% endif %}
    >
    <label
      class="form-check-label small"
      for="{{ item_filter_id_prefix|default:'item-filter' }}-exclude"
    >
      {% trans "Exclude selected types" %}
    </label>
  </div>
</fieldset>
